name: deploy-pages

# Builds the docs/ research paper and publishes it to GitHub Pages.
# Serves at https://<owner>.github.io/<repo>/ once Pages is enabled.
# REQUIRED one-time setup: Repo Settings -> Pages -> Source = "GitHub Actions".
# (Without that toggle, actions/deploy-pages@v4 fails with 'cannot read pages
# configuration' / "GitHub Pages is not enabled".)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage the paper
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          echo "Staged docs/index.html -> _site/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
